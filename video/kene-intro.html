<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hành trình Kể Nè — Giới thiệu tương tác</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#143367;color:white;font:17px/1.7 "Segoe UI",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}.cover,.shade{position:fixed;inset:0}.cover img{width:100%;height:100%;object-fit:cover}.shade{background:linear-gradient(100deg,#101c50ed,#103866b0)}main{position:relative;z-index:1;max-width:680px;width:100%;padding:18px}.eyebrow{font-size:10px;letter-spacing:4px;font-weight:700;color:#b6eaf3}h1{font-size:clamp(27px,5vw,43px);line-height:1.2;margin:18px 0}p{max-width:580px;color:#edf7ff}.progress{display:flex;gap:8px;margin:28px 0}.dot{height:4px;background:#ffffff45;flex:1;border:0;padding:0;border-radius:8px;cursor:pointer}.dot.active{background:#71dcee}.nav{display:flex;gap:12px;align-items:center}button{font:inherit;border:1px solid #ffffff60;border-radius:30px;padding:8px 21px;background:#ffffff16;color:white;cursor:pointer}button:hover{background:#ffffff30}button:focus-visible{outline:3px solid #6bd9ed;outline-offset:4px}.primary{background:white;color:#18376d;font-weight:700}.primary:hover{background:#edf9ff}.count{font-size:12px;color:#c6e3ef}.note{font-size:11px;color:#bfdae8;margin-top:24px}.message{animation:enter .4s ease both}@keyframes enter{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:480px){body{padding:10px}main{padding:17px}p{font-size:15px}.nav button{font-size:13px;padding:8px 15px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html.ke-reduced *{animation:none!important;transition:none!important}</style>
</head>
<body>
<picture class="cover"><source id="cover-source" type="image/webp" srcset="../img/photos/v3-online-friends-960.webp 960w, ../img/photos/v3-online-friends-1920.webp 1920w" sizes="100vw"><img id="cover-image" src="../img/photos/v3-online-friends-1920.jpg" alt="Ảnh minh hoạ một không gian lắng nghe"></picture><div class="shade"></div>
<main><span class="eyebrow">HÀNH TRÌNH KỂ NÈ</span><div class="progress" aria-label="Chọn bước giới thiệu"><button class="dot active" data-step="0" aria-label="Bước 1" aria-current="step"></button><button class="dot" data-step="1" aria-label="Bước 2"></button><button class="dot" data-step="2" aria-label="Bước 3"></button><button class="dot" data-step="3" aria-label="Bước 4"></button></div><div id="message" class="message" aria-live="polite"><span class="count" id="number">BƯỚC 1 / 4</span><h1 id="title">Hiểu nhu cầu</h1><p id="text">Bắt đầu bằng sàng lọc và câu hỏi an toàn. Kết quả không phải chẩn đoán.</p></div><div class="nav"><button id="previous" aria-label="Bước trước">←</button><button id="next" class="primary">Bước tiếp theo →</button></div><p class="note">Khám phá hành trình Kể Nè</p></main>
<script>
const items=[['Hiểu nhu cầu','Bắt đầu bằng sàng lọc và câu hỏi an toàn. Kết quả không phải chẩn đoán.','v3-online-friends'],['Chọn người và khung giờ','Xem gợi ý có lý do; tự chọn điều phù hợp.','v3-group-sharing'],['Giữ chỗ và xác nhận','Xem lại thời gian, mức giá và điều kiện trước khi lưu yêu cầu.','v3-journal-modern'],['Đồng hành và nhìn lại','Phiên cá nhân 50 phút, phản hồi và lựa chọn bước tiếp theo.','v3-work-casual']];
try{if(JSON.parse(localStorage.getItem('kene_reduce_motion_v2')))document.documentElement.classList.add('ke-reduced');}catch(_){}
let index=0;
function render(next){index=(next+4)%4;const item=items[index];document.getElementById('title').textContent=item[0];document.getElementById('text').textContent=item[1];document.getElementById('number').textContent='BƯỚC '+(index+1)+' / 4';document.getElementById('cover-source').srcset='../img/photos/'+item[2]+'-960.webp 960w, ../img/photos/'+item[2]+'-1920.webp 1920w';document.getElementById('cover-image').src='../img/photos/'+item[2]+'-1920.jpg';document.querySelectorAll('[data-step]').forEach((b,i)=>{b.classList.toggle('active',i===index);if(i===index)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});const old=document.getElementById('message'),fresh=old.cloneNode(true);old.replaceWith(fresh);}
document.getElementById('next').addEventListener('click',()=>render(index+1));document.getElementById('previous').addEventListener('click',()=>render(index-1));document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>render(Number(b.dataset.step))));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')render(index+1);if(e.key==='ArrowLeft')render(index-1);});
</script>
</body>
</html>
